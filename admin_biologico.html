        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDW-KIxM3m5QXnfzpOUmwhuLILLAk6u5rA",
            authDomain: "lapi-productividad.firebaseapp.com",
            projectId: "lapi-productividad",
            storageBucket: "lapi-productividad.firebasestorage.app",
            messagingSenderId: "1077149571149",
            appId: "1:1077149571149:web:e1423dde4a8de6f8562404"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace('index.html');
            else document.body.classList.remove('hidden');
        });

        window.cerrarSesionAdmin = () => {
            signOut(auth).then(() => { window.location.replace('index.html'); }).catch((e) => console.error(e));
        };

        window.db = getFirestore(app);
        window.getDocs = getDocs;
        window.collection = collection;
        window.query = query;
        window.orderBy = orderBy;
        window.where = where;
        window.doc = doc;
        window.updateDoc = updateDoc;

        document.addEventListener("DOMContentLoaded", () => {
            if(typeof window.cargarDatosGlobales === "function"){
                window.cargarDatosGlobales(); 
            }
        });
    </script>

    <script>
        let mapaDirectorioServicios = {}; 
        let equiposGlobales = [];
        let vistaActual = 'activo';

        window.mostrarToast = function(mensaje, tipo = 'info') {
            const toast = document.createElement('div');
            const color = tipo === 'exito' ? 'bg-emerald-500' : (tipo === 'error' ? 'bg-red-500' : 'bg-orange-600');
            const icono = tipo === 'exito' ? 'fa-check-circle' : (tipo === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            toast.className = `${color} text-white px-4 py-3 rounded-xl shadow-lg font-bold text-xs flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0 max-w-xs`;
            toast.innerHTML = `<i class="fa-solid ${icono} text-base"></i> <span class="leading-tight">${mensaje}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        };

        window.filtrarVista = function(estado) {
            vistaActual = estado;
            ['activo', 'pausa', 'finalizado'].forEach(e => document.getElementById(`tab-${e}`).classList.remove('active'));
            document.getElementById(`tab-${estado}`).classList.add('active');
            renderizarLista();
        };

        // ===============================================
        // EXTRACCIÓN Y CRUCE DE DATOS
        // ===============================================
        window.cargarDatosGlobales = async function() {
            const container = document.getElementById('contenedor-resultados');
            container.innerHTML = '<div class="text-center py-20 text-slate-400 italic"><i class="fa-solid fa-spinner fa-spin text-4xl mb-3 text-orange-400 block"></i> Sincronizando con Directorio de Servicios...</div>';
            
            try {
                // 1. OBTENEMOS EL DIRECTORIO MAESTRO DE SERVICIOS
                const qDir = window.query(window.collection(window.db, "directorio_servicios"));
                const snapDir = await window.getDocs(qDir);
                mapaDirectorioServicios = {};
                snapDir.forEach(doc => {
                    let d = doc.data();
                    mapaDirectorioServicios[doc.id] = { estado: d.estado, empresa: d.nombreComercial };
                });

                // 2. OBTENEMOS LOS EQUIPOS DE CONTROL BIOLÓGICO
                const qBio = window.query(window.collection(window.db, "control_biologico"));
                const snapBio = await window.getDocs(qBio);
                equiposGlobales = [];

                snapBio.forEach(doc => {
                    let eq = doc.data();
                    eq.id = doc.id;
                    
                    // Sincronización Automática: Heredar el estado del Servicio Matriz
                    if (eq.idServicio && mapaDirectorioServicios[eq.idServicio]) {
                        eq.estado_real = mapaDirectorioServicios[eq.idServicio].estado;
                        eq.empresa_real = mapaDirectorioServicios[eq.idServicio].empresa;
                    } else {
                        // Fallback si por alguna razón el servicio se borró o es antiguo
                        eq.estado_real = 'finalizado';
                        eq.empresa_real = eq.empresa;
                    }
                    
                    equiposGlobales.push(eq);
                });

                renderizarLista();

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p class="text-center text-xs text-red-500 py-10 font-bold">Error de conexión con la base de datos.</p>';
            }
        };

        // ===============================================
        // RENDERIZADO VISUAL
        // ===============================================
        window.renderizarLista = function() {
            const container = document.getElementById('contenedor-resultados');
            const textoBuscado = (document.getElementById('buscador-equipos').value || '').toLowerCase();
            const mesBuscado = document.getElementById('filtro-mes').value; // Formato YYYY-MM
            
            // 1. Filtrar Equipos
            let filtrados = equiposGlobales.filter(eq => {
                if (eq.estado_real !== vistaActual) return false;

                if (textoBuscado) {
                    const str = `${eq.empresa_real} ${eq.ns_equipo} ${eq.tipo}`.toLowerCase();
                    if (!str.includes(textoBuscado)) return false;
                }

                if (mesBuscado) {
                    let caeEnMes = false;
                    const mesInicio = eq.fecha_inicio ? eq.fecha_inicio.substring(0, 7) : '';
                    if (mesInicio === mesBuscado) caeEnMes = true;
                    if (!caeEnMes && eq.bitacora) {
                        caeEnMes = eq.bitacora.some(b => b.fecha.substring(0, 7) === mesBuscado);
                    }
                    if (!caeEnMes) return false;
                }

                return true;
            });
            
            if(filtrados.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-slate-400 py-10">No hay empresas con equipos registrados en esta pestaña.</p>`;
                return;
            }

            // 2. Agrupar Equipos por Empresa
            let agrupados = {};
            filtrados.forEach(eq => {
                let emp = eq.empresa_real;
                if(!agrupados[emp]) agrupados[emp] = [];
                agrupados[emp].push(eq);
            });

            // 3. Generar HTML
            let finalHtml = '';
            
            // Ordenar las empresas alfabéticamente
            Object.keys(agrupados).sort().forEach((empresaNombre, indexEmpresa) => {
                let equiposEmpresa = agrupados[empresaNombre];
                let htmlEquipos = '';

                equiposEmpresa.forEach((eq, indexEquipo) => {
                    const icono = eq.tipo === 'audiometria' ? 'fa-headphones text-orange-500' : 'fa-lungs text-blue-500';
                    const numRegs = eq.bitacora ? eq.bitacora.length : 0;
                    let cabinaBadge = eq.tipo === 'audiometria' && eq.ns_cabina ? `<span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-slate-600">Cabina: <b>${eq.ns_cabina}</b></span>` : '';
                    
                    let thHtml = ''; let trHtml = '';
                    if(numRegs === 0) {
                        trHtml = `<tr><td colspan="5" class="py-4 text-center text-xs text-slate-400 italic font-bold">No hay calibraciones registradas para este equipo.</td></tr>`;
                    } else {
                        if(eq.tipo === 'audiometria') {
                            thHtml = `<tr><th class="py-2 px-3 text-left">Fecha</th><th class="py-2 px-3 text-center">Frec. OD Prom</th><th class="py-2 px-3 text-center">Frec. OI Prom</th><th class="py-2 px-3 text-right">Técnico/Médico</th></tr>`;
                            eq.bitacora.forEach((b, indexBitacora) => {
                                let promOD = b.od ? Object.values(b.od).filter(v=>v).length : 0; 
                                let promOI = b.oi ? Object.values(b.oi).filter(v=>v).length : 0;
                                // Inyectamos temporalmente los índices para el botón
                                eq.indexEmpresaTemp = indexEmpresa; eq.indexEquipoTemp = indexEquipo;
                                
                                let btnOD = `<button onclick="abrirDetalleAudio('${eq.id}', ${indexBitacora})" class="text-red-500 hover:text-red-700 underline decoration-red-300 underline-offset-2 transition-colors"><i class="fa-solid fa-up-right-from-square mr-1"></i>${promOD}/8 capt.</button>`;
                                let btnOI = `<button onclick="abrirDetalleAudio('${eq.id}', ${indexBitacora})" class="text-blue-500 hover:text-blue-700 underline decoration-blue-300 underline-offset-2 transition-colors"><i class="fa-solid fa-up-right-from-square mr-1"></i>${promOI}/8 capt.</button>`;
                                trHtml += `<tr class="border-t border-slate-100 hover:bg-slate-50 transition"><td class="py-2 px-3 text-[10px] font-black text-slate-500">${b.fecha}</td><td class="py-2 px-3 text-center text-xs font-bold">${btnOD}</td><td class="py-2 px-3 text-center text-xs font-bold">${btnOI}</td><td class="py-2 px-3 text-right text-[9px] font-bold text-slate-400 uppercase tracking-widest">${b.medico}</td></tr>`;
                            });
                        } else {
                            thHtml = `<tr><th class="py-2 px-3 text-left">Fecha</th><th class="py-2 px-3 text-center">Inspirar %</th><th class="py-2 px-3 text-center">Espirar %</th><th class="py-2 px-3 text-right">Técnico/Médico</th></tr>`;
                            eq.bitacora.forEach(b => {
                                trHtml += `<tr class="border-t border-slate-100 hover:bg-slate-50 transition"><td class="py-2 px-3 text-[10px] font-black text-slate-500">${b.fecha}</td><td class="py-2 px-3 text-center text-xs text-sky-600 font-bold">${b.inspirar_porcentaje}%</td><td class="py-2 px-3 text-center text-xs text-sky-600 font-bold">${b.espirar_porcentaje}%</td><td class="py-2 px-3 text-right text-[9px] font-bold text-slate-400 uppercase tracking-widest">${b.medico}</td></tr>`;
                            });
                        }
                    }

                    htmlEquipos += `
                        <div class="bg-white border border-slate-200 rounded-2xl mb-4 overflow-hidden shadow-sm">
                            <div class="p-4 bg-slate-50 flex flex-wrap gap-2 text-[10px] font-bold text-slate-500 tracking-wider items-center border-b border-slate-100">
                                <span class="bg-white px-2 py-1 rounded border border-slate-200 shadow-sm text-slate-700 text-xs uppercase"><i class="fa-solid ${icono} mr-1"></i> ${eq.equipo}</span>
                                <span class="bg-white px-2 py-1 rounded border border-slate-200 shadow-sm"><i class="fa-solid fa-barcode mr-1 text-slate-400"></i> N/S: <b class="text-orange-500">${eq.ns_equipo}</b></span>
                                ${cabinaBadge}
                            </div>
                            <div class="p-4">
                                <h4 class="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 pb-1 border-b border-slate-100">Bitácora de Calibraciones (${numRegs})</h4>
                                <div class="overflow-x-auto bg-white rounded-xl border border-slate-100">
                                    <table class="w-full text-left">
                                        <thead class="bg-slate-50 text-[9px] uppercase text-slate-500">${thHtml}</thead>
                                        <tbody>${trHtml}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                });

                finalHtml += `
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mb-2">
                        <div onclick="toggleAcordeon('empresa-${indexEmpresa}')" class="p-5 bg-slate-50 cursor-pointer hover:bg-slate-100 transition relative select-none border-b border-slate-200 flex justify-between items-center group">
                            <div>
                                <h3 class="font-black text-lg text-slate-800 uppercase leading-tight group-hover:text-orange-600 transition-colors"><i class="fa-solid fa-building mr-2 text-slate-400"></i>${empresaNombre}</h3>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1"><i class="fa-solid fa-microchip mr-1"></i> ${equiposEmpresa.length} Equipos Vinculados</p>
                            </div>
                            <div class="text-slate-300 text-xl group-hover:text-orange-500 transition-colors"><i class="fa-solid fa-chevron-down"></i></div>
                        </div>
                        <div id="empresa-${indexEmpresa}" class="acordeon-content bg-slate-50/50 px-5">
                            ${htmlEquipos}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = finalHtml;
        }

        window.toggleAcordeon = function(idDOM) {
            const el = document.getElementById(idDOM);
            el.classList.toggle('open');
        };

        window.abrirDetalleAudio = function(idFirebase, indexBitacora) {
            const eq = equiposGlobales.find(e => e.id === idFirebase);
            const b = eq.bitacora[indexBitacora];
            document.getElementById('mod-audio-fecha').innerText = `Calibración del: ${b.fecha}`;
            
            const gridOD = document.getElementById('grid-od'); const gridOI = document.getElementById('grid-oi');
            gridOD.innerHTML = ''; gridOI.innerHTML = '';
            const frecs = [250, 500, 1000, 2000, 3000, 4000, 6000, 8000];
            frecs.forEach(f => {
                let valOD = (b.od && b.od[f]) ? b.od[f] : '-'; let valOI = (b.oi && b.oi[f]) ? b.oi[f] : '-';
                gridOD.innerHTML += `<div class="bg-white border border-slate-200 p-2 rounded-lg text-xs shadow-sm"><p class="text-[9px] text-slate-400 mb-0.5 font-bold">${f}</p><b class="text-slate-700">${valOD}</b></div>`;
                gridOI.innerHTML += `<div class="bg-white border border-slate-200 p-2 rounded-lg text-xs shadow-sm"><p class="text-[9px] text-slate-400 mb-0.5 font-bold">${f}</p><b class="text-slate-700">${valOI}</b></div>`;
            });

            const modal = document.getElementById('modal-audio'); const card = document.getElementById('modal-audio-card');
            modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); card.classList.remove('scale-95'); }, 10);
        };

        window.cerrarModalAudio = function() {
            const modal = document.getElementById('modal-audio'); const card = document.getElementById('modal-audio-card');
            modal.classList.add('opacity-0'); card.classList.add('scale-95'); setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        // =========================================================
        // MOTOR AVANZADO DE REPORTE PDF (INTACTO)
        // =========================================================
        window.abrirModalReporte = function() {
            const modal = document.getElementById('modal-reporte-avanzado'); const card = document.getElementById('modal-reporte-avanzado-card');
            modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); card.classList.remove('scale-95'); }, 10);
        };
        window.cerrarModalReporte = function() {
            const modal = document.getElementById('modal-reporte-avanzado'); const card = document.getElementById('modal-reporte-avanzado-card');
            modal.classList.add('opacity-0'); card.classList.add('scale-95'); setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        window.cambiarModoReporte = function() {
            const modo = document.getElementById('rep-modo').value;
            if(modo === 'estudio') {
                document.getElementById('rep-box-estudio').classList.remove('hidden');
                document.getElementById('rep-box-ns').classList.add('hidden');
            } else {
                document.getElementById('rep-box-estudio').classList.add('hidden');
                document.getElementById('rep-box-ns').classList.remove('hidden');
            }
        };

        window.ejecutarReportePersonalizado = async function() {
            const btn = document.getElementById('btn-generar-pdf-avanzado');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Construyendo...'; btn.disabled = true;

            const modo = document.getElementById('rep-modo').value;
            const fIni = document.getElementById('rep-f-ini').value;
            const fFin = document.getElementById('rep-f-fin').value;
            const zona = document.getElementById('zona-impresion');
            
            try {
                // Consultar DB fresca para imprimir
                const q = window.query(window.collection(window.db, "control_biologico"), window.orderBy("timestamp", "asc"));
                const qs = await window.getDocs(q);
                let equiposAImprimir = [];

                qs.forEach(doc => {
                    let s = doc.data();
                    let pasaFiltro = true;

                    if(modo === 'estudio') {
                        if(s.tipo !== document.getElementById('rep-estudio-val').value) pasaFiltro = false;
                    } else {
                        if(s.ns_equipo.toUpperCase() !== document.getElementById('rep-ns-val').value.trim().toUpperCase()) pasaFiltro = false;
                    }

                    if(pasaFiltro) {
                        if(fIni && fFin && s.bitacora) {
                            s.bitacora = s.bitacora.filter(b => b.fecha >= fIni && b.fecha <= fFin);
                        }
                        if(s.bitacora && s.bitacora.length > 0) {
                            equiposAImprimir.push(s);
                        }
                    }
                });

                if(equiposAImprimir.length === 0) {
                    mostrarToast("No se encontraron registros de calibración con los parámetros ingresados.", "error");
                    btn.innerHTML = '<i class="fa-solid fa-print"></i> Consultar e Imprimir'; btn.disabled = false;
                    return;
                }

                zona.innerHTML = ''; let htmlPDF = '';
                equiposAImprimir.forEach(data => {
                    htmlPDF += '<div class="servicio-print-block">';
                    if(data.tipo === 'audiometria') htmlPDF += renderizarPDF_Audiometria(data);
                    else htmlPDF += renderizarPDF_Espirometria(data);
                    htmlPDF += '</div>';
                });
                zona.innerHTML = htmlPDF;

                cerrarModalReporte();
                setTimeout(() => { window.print(); }, 800);

            } catch(e) { mostrarToast("Error extrayendo información.", "error"); }
            btn.innerHTML = '<i class="fa-solid fa-print"></i> Consultar e Imprimir'; btn.disabled = false;
        };

        function renderizarPDF_Audiometria(data) {
            let filasBitacora = '';
            if(data.bitacora) {
                data.bitacora.forEach(b => {
                    let oi = b.oi || {}; let od = b.od || {};
                    filasBitacora += `
                    <tr>
                        <td style="font-weight: bold;">${b.fecha}</td>
                        <td>${od[250]||''}</td><td>${od[500]||''}</td><td>${od[1000]||''}</td><td>${od[2000]||''}</td><td>${od[3000]||''}</td><td>${od[4000]||''}</td><td>${od[6000]||''}</td><td>${od[8000]||''}</td>
                        <td style="border-top: none; border-bottom: none;"></td> <td>${oi[250]||''}</td><td>${oi[500]||''}</td><td>${oi[1000]||''}</td><td>${oi[2000]||''}</td><td>${oi[3000]||''}</td><td>${oi[4000]||''}</td><td>${oi[6000]||''}</td><td>${oi[8000]||''}</td>
                        <td style="padding: 2px;">
                            <div style="font-size: 8px; line-height: 1; font-weight: bold;">${b.medico}</div>
                            ${b.firma ? `<img src="${b.firma}" class="firma-img">` : ''}
                        </td>
                    </tr>`;
                });
            }
            return `
                <table class="header-box">
                    <tr>
                        <td style="width: 25%; text-align: center; vertical-align: middle;">
                            <img src="logoLAPI.png" style="max-width: 150px; max-height: 65px; display: block; margin: 0 auto;">
                        </td>
                        <td style="width: 50%;" class="header-title">CONTROL BIOLÓGICO<br>AUDIOMETRÍAS</td>
                        <td style="width: 25%; padding: 0;">
                            <table style="width: 100%; height: 100%; border-collapse: collapse; text-align: center; border: none;">
                                <tr><td style="border-top: none; border-left: none; font-weight: bold; width: 50%;">Código:</td><td style="border-top: none; border-right: none;">F-55-P11</td></tr>
                                <tr><td style="border-left: none; font-weight: bold;">Versión:</td><td style="border-right: none;">1</td></tr>
                                <tr><td style="border-left: none; font-weight: bold;">Fecha de<br>actualización:</td><td style="border-right: none;">05-Agosto-23</td></tr>
                                <tr><td style="border-bottom: none; border-left: none; font-weight: bold;">Página:</td><td style="border-bottom: none; border-right: none;">1 de 1</td></tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <table style="width: 100%; font-family: Arial, sans-serif; font-size: 11px; margin-bottom: 15px; border-collapse: collapse;">
                    <tr>
                        <td style="width: 12%; font-weight: bold; padding: 3px 0;">AUDIÓMETRO:</td><td style="width: 38%; border-bottom: 1px solid #000; padding: 3px 5px;">${data.equipo}</td>
                        <td style="width: 12%; font-weight: bold; padding: 3px 0; padding-left: 15px;">N/S:</td><td style="width: 38%; border-bottom: 1px solid #000; padding: 3px 5px;">${data.ns_equipo}</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold; padding: 3px 0;">EMPRESA:</td><td style="border-bottom: 1px solid #000; padding: 3px 5px;">${data.empresa}</td>
                        <td style="font-weight: bold; padding: 3px 0; padding-left: 15px;">N/S CABINA:</td><td style="border-bottom: 1px solid #000; padding: 3px 5px;">${data.ns_cabina || ''}</td>
                    </tr>
                </table>
                <div style="display: flex; justify-content: space-around; font-family: Arial; font-weight: bold; margin-bottom: 5px; font-size: 14px;">
                    <div style="width: 45%; text-align: center;">OÍDO DERECHO</div><div style="width: 45%; text-align: center;">OÍDO IZQUIERDO</div>
                </div>
                <table class="print-table">
                    <thead>
                        <tr>
                            <th rowspan="2" class="bg-verde-lapi">FECHA</th><th colspan="8" class="bg-rojo-lapi"></th><th rowspan="2" style="background: white !important; border-top: none; border-bottom: none; width: 2%;"></th><th colspan="8" style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;"></th><th rowspan="2" class="bg-verde-lapi">REALIZÓ<br>NOMBRE Y FIRMA</th>
                        </tr>
                        <tr>
                            <th class="bg-rojo-lapi">250</th><th class="bg-rojo-lapi">500</th><th class="bg-rojo-lapi">1000</th><th class="bg-rojo-lapi">2000</th><th class="bg-rojo-lapi">3000</th><th class="bg-rojo-lapi">4000</th><th class="bg-rojo-lapi">6000</th><th class="bg-rojo-lapi">8000</th>
                            <th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">250</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">500</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">1000</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">2000</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">3000</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">4000</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">6000</th><th style="background-color: #e5e7eb !important; -webkit-print-color-adjust: exact; color-adjust: exact;">8000</th>
                        </tr>
                    </thead>
                    <tbody>${filasBitacora}</tbody>
                </table>
            `;
        }

        function renderizarPDF_Espirometria(data) {
            let filasBitacora = '';
            if(data.bitacora) {
                data.bitacora.forEach(b => {
                    filasBitacora += `
                    <tr>
                        <td style="font-weight: bold; padding: 4px;">${b.fecha}</td>
                        <td style="padding: 4px;">${b.inspirar_porcentaje || ''} %</td>
                        <td style="padding: 4px;">${b.espirar_porcentaje || ''} %</td>
                        <td style="font-size: 10px; font-weight: bold; padding: 4px;">${b.medico}</td>
                        <td style="padding: 2px;">${b.firma ? `<img src="${b.firma}" class="firma-img">` : ''}</td>
                    </tr>`;
                });
            }
            return `
                <table class="header-box">
                    <tr>
                        <td style="width: 25%; text-align: center; vertical-align: middle;"><img src="logoLAPI.png" style="max-width: 150px; max-height: 65px; display: block; margin: 0 auto;"></td>
                        <td style="width: 50%;" class="header-title">CONTROL BIOLÓGICO<br>ESPIROMETRÍA</td>
                        <td style="width: 25%; padding: 0;">
                            <table style="width: 100%; height: 100%; border-collapse: collapse; text-align: center; border: none;">
                                <tr><td style="border-top: none; border-left: none; font-weight: bold; width: 50%;">Código:</td><td style="border-top: none; border-right: none;">F-56-P11</td></tr>
                                <tr><td style="border-left: none; font-weight: bold;">Versión:</td><td style="border-right: none;">1</td></tr>
                                <tr><td style="border-left: none; font-weight: bold;">Fecha de<br>actualización:</td><td style="border-right: none;">05-Agosto-23</td></tr>
                                <tr><td style="border-bottom: none; border-left: none; font-weight: bold;">Página:</td><td style="border-bottom: none; border-right: none;">1 de 1</td></tr>
                            </table>
                        </td>
                    </tr>
                </table>
                <table style="width: 100%; font-family: Arial, sans-serif; font-size: 11px; margin-bottom: 15px; border-collapse: collapse;">
                    <tr>
                        <td style="width: 12%; font-weight: bold; padding: 3px 0;">ESPIRÓMETRO:</td><td style="width: 38%; border-bottom: 1px solid #000; padding: 3px 5px;">${data.equipo}</td>
                        <td style="width: 12%; font-weight: bold; padding: 3px 0; padding-left: 15px;">N/S:</td><td style="width: 38%; border-bottom: 1px solid #000; padding: 3px 5px;">${data.ns_equipo}</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold; padding: 3px 0;">EMPRESA:</td><td style="border-bottom: 1px solid #000; padding: 3px 5px;">${data.empresa}</td>
                        <td style="font-weight: bold; padding: 3px 0; padding-left: 15px;">FECHAS:</td><td style="border-bottom: 1px solid #000; padding: 3px 5px;"></td>
                    </tr>
                </table>
                <table class="print-table" style="font-size: 12px;">
                    <thead>
                        <tr><th rowspan="2" style="width: 15%;">FECHA</th><th colspan="2">DIFERENCIA RELATIVA AL VOLUMEN INDICADO</th><th colspan="2">REALIZÓ</th></tr>
                        <tr><th style="width: 20%;">INSPIRAR %</th><th style="width: 20%;">ESPIRAR %</th><th style="width: 25%;">NOMBRE</th><th style="width: 20%;">FIRMA</th></tr>
                    </thead>
                    <tbody>${filasBitacora}</tbody>
                </table>
            `;
        }
    </script>
</body>
</html>
